name: Publish lab dev-container

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .devcontainer/Dockerfile
      - .github/workflows/publish-devcontainer.yml

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: shuranxu/embeddedville-soc-course-2-lab-devcontainer

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the lab starter
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the pinned toolchain
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:course-2-v1.0.0
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
        run: |
          docker pull "$IMAGE_REF"
          docker run --rm "$IMAGE_REF" bash -lc 'arm-none-eabi-gcc --version && verilator --version && renode --version'
